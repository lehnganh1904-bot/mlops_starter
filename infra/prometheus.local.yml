# Cấu hình dùng cho lab buổi 07: Prometheus chạy trong Docker,
# API chạy bằng uvicorn trên máy host (cổng 8000).
# Stack đầy đủ qua Docker Compose (buổi 08) dùng infra/prometheus.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "model-api"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
